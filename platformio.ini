;=============== ESP32 CONTROLLER (separate MCU) ================
; Not a hoverboard-firmware variant: this is the ESP32 "brain" whose sources
; live in esp32-controller/src/. Selectable as its own env in the IDE.
; Build/flash: pio run -e esp32dev [-t upload]
[env:esp32dev]
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
; Uncomment and set your port if auto-detect fails:
; upload_port    = /dev/cu.usbserial-0001
; monitor_port   = /dev/cu.usbserial-0001
; Compile ONLY the ESP32 sources (overrides the global [env] filter). Path is
; relative to src_dir = project root.
build_src_filter = -<*> +<esp32-controller/src/>
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -I ${PROJECT_DIR}/esp32-controller/src

;================================================================
